# Copy to runtime/config.yaml
token: ""                # Discord bot token
bot_prefix: "."
saucenao_api_key: ""
# Used for Zerochan (which wants "BotName - your zerochan username"), Danbooru, IQDB, etc.
user_agent: "BuzzUtils3 - username"
# The classifier service; with docker-compose this is the inference-server container.
# Leave empty to disable the NSFW filter (images are then only filtered by site ratings).
# The INFERENCE_SERVER environment variable overrides this (e.g. http://localhost:8000).
inference_server: "http://inference-server:8000"
pixiv_refresh_token: ""  # See https://gist.github.com/ZipFile/c9ebedb224406f4f11845ab700124362
# Optional: lets music play Spotify track/album links (searched on YouTube).
# Create an app at https://developer.spotify.com/dashboard. Spotify only lets bots
# read albums and tracks, not other people's playlists.
spotify_client_id: ""
spotify_client_secret: ""
